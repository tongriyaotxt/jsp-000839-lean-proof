name: verify

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4 (elan, v4.34.0)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Kernel-check the proof
        run: |
          set -e
          lean Jsp000839.lean
          echo "PROOF VERIFIED: no errors"

      - name: Axiom audit
        run: |
          set -e
          OUT=$(lean Jsp000839.lean 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -q "sorryAx"; then
            echo "ERROR: sorryAx present"
            exit 1
          fi
          echo "AXIOM AUDIT PASSED: no sorryAx"
